---
- name: Install firewalld
  ansible.builtin.yum:
    name: firewalld
    state: present

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Allow HTTP (port 80) through firewalld
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled

- name: Allow SSH (port 22) through firewalld
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    immediate: true
    state: enabled

- name: Ensure app directory is not world-writable
  ansible.builtin.file:
    path: "{{ app_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0750'
    recurse: true

- name: Restrict database file permissions
  ansible.builtin.file:
    path: "{{ db_path }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0640'
  ignore_errors: true   # file may not exist yet on first run — app creates it at startup
