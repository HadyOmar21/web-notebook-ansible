---
- name: Stop and disable Apache (conflicts with nginx on port 80)
  ansible.builtin.systemd:
    name: httpd
    state: stopped
    enabled: false
  ignore_errors: true   # in case httpd isn't present on a different base AMI

- name: Install nginx
  ansible.builtin.yum:
    name: nginx
    state: present

- name: Deploy main nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
  notify: restart nginx

- name: Deploy nginx site config
  ansible.builtin.template:
    src: notes-app.conf.j2
    dest: /etc/nginx/conf.d/notes-app.conf
    mode: '0644'
  notify: restart nginx

- name: Remove default nginx welcome page config (avoid conflicts)
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  ignore_errors: true

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
